# Spédago — chaîne complète à chaque poussée sur main, chaque lundi (données rafraîchies) et à la demande :
# téléchargement des données ouvertes → pipeline d'analyse → application web (Vite) → tests → publication sur GitHub Pages.
# Un test qui échoue (données sources modifiées, calcul divergent, accessibilité) bloque la publication,
# de même qu'une violation grave relevée par axe-core sur le site construit (ordinateur et téléphone).
name: Construire et publier le site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"   # lundi 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tools/package-lock.json
      - name: Dépendances Python
        run: pip install -r requirements.txt
      - name: Pipeline complet (données, analyses, site, tests)
        run: bash run_all.sh
      - name: Accessibilité du site construit (axe-core + Playwright, 1280 et 390 px)
        run: |
          npm ci --prefix tools --no-audit --no-fund
          tools/node_modules/.bin/playwright install --with-deps chromium
          (cd web && npx vite preview --port 4173 --strictPort &)
          for i in $(seq 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          node tools/check_a11y.mjs web/dist tools/node_modules/axe-core/axe.min.js http://localhost:4173/ | tee a11y.txt
          { echo "### Accessibilité (axe-core)"; echo '```'; cat a11y.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Rapport de la construction
        if: always()
        run: |
          echo "### Spédago" >> "$GITHUB_STEP_SUMMARY"
          git log -1 --format='Commit : %h %s' >> "$GITHUB_STEP_SUMMARY"
          # Données sources changées depuis le dernier commit ? Le MANIFEST est réécrit au téléchargement :
          # on compare les empreintes (pas les dates) à la version versionnée.
          python3 - <<'PY'
          import csv, io, os, subprocess
          diff = []
          for f, sep in (("data/raw/MANIFEST.csv", ","), ("data/raw/MANIFEST_eurostat.csv", ";")):
              lire = lambda t: {r["fichier"]: r["sha256"] for r in csv.DictReader(io.StringIO(t), delimiter=sep)}
              avant = lire(subprocess.run(["git", "show", f"HEAD:{f}"], capture_output=True, text=True).stdout)
              apres = lire(open(f, encoding="utf-8").read())
              diff += [k for k in sorted(set(avant) | set(apres)) if avant.get(k) != apres.get(k)]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              if diff:
                  out.write("**Données sources modifiées par les producteurs depuis le MANIFEST versionné :** " + ", ".join(diff) + "\n")
                  print("::warning::Données sources modifiées (" + ", ".join(diff) + ") : relire puis versionner le MANIFEST.")
              else:
                  out.write("Données sources identiques au MANIFEST versionné.\n")
          PY
          ls -la web/dist/data >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
