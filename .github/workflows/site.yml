# Spédago — chaîne complète à chaque poussée sur main, chaque lundi (données rafraîchies) et à la demande :
# téléchargement des données ouvertes → pipeline d'analyse → application web (Vite) → tests → publication sur GitHub Pages.
# Un test qui échoue (données sources modifiées, calcul divergent, accessibilité) bloque la publication.
name: Construire et publier le site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"   # lundi 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Dépendances Python
        run: pip install -r requirements.txt
      - name: Pipeline complet (données, analyses, site, tests)
        run: bash run_all.sh
      - name: Rapport de la construction
        if: always()
        run: |
          echo "### Spédago" >> "$GITHUB_STEP_SUMMARY"
          git log -1 --format='Commit : %h %s' >> "$GITHUB_STEP_SUMMARY"
          ls -la web/dist/data >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
