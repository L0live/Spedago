<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style id="commun-css">
/* Spédago — système visuel commun (thème clair uniquement).
   Jetons alignés sur Tailwind : neutres slate, couleur principale blue-700 (liens, navigation, focus),
   couleur secondaire orange (repères : académie choisie, valeurs à surveiller, porte « décideurs »).
   Règle 60-30-10 : neutres partout, bleu pour agir, orange pour signaler — jamais pour décorer. */
:root {
  color-scheme: light;
  --bg: #f8fafc; --surface: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --track: #f1f5f9;
  --accent: #1d4ed8; --accent-strong: #1e40af; --accent-soft: #eff6ff; --accent-mark: #2563eb;
  --orange: #ea580c; --orange-ink: #c2410c; --orange-soft: #fff7ed; --orange-line: #fed7aa;
  --radius: 12px; --radius-sm: 8px;
  --shadow-sm: 0 1px 2px rgb(15 23 42 / .05), 0 1px 3px rgb(15 23 42 / .04);
  --shadow-md: 0 6px 16px -4px rgb(15 23 42 / .10), 0 2px 4px rgb(15 23 42 / .04);
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html { background: var(--bg) }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; padding-inline: 16px; padding-block: 0 48px; margin: 0;
       -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(32px, 5vw, 46px); line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 10px; text-wrap: balance }
h2 { letter-spacing: -0.01em }
::selection { background: var(--orange-line) }
a { color: var(--accent) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
         color: var(--orange-ink); background: var(--orange-soft); border: 1px solid var(--orange-line); border-radius: 999px; padding: 3px 10px; margin-bottom: 16px }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--orange) }
.lede { line-height: 1.6 }

/* Barre du site : marque, puis les deux portes */
.site-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding-block: 16px 12px; border-bottom: 1px solid var(--line); font-size: 14px }
.site-nav .brand { display: inline-flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; margin-right: 8px }
.site-nav .brand::before { content: ""; width: 12px; height: 12px; border-radius: 3px; background: linear-gradient(135deg, var(--accent-mark) 0 50%, var(--orange) 50% 100%) }
.site-nav .door { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px }
.site-nav .door > span { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.site-nav .door a { color: var(--accent); text-decoration: none; padding: 3px 0; border-bottom: 2px solid transparent; transition: color .15s ease-out, border-color .15s ease-out }
.site-nav .door a:hover { color: var(--accent-strong); border-bottom-color: var(--line) }
.site-nav .door a[aria-current="page"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--orange) }
.site-nav .sep { width: 1px; height: 18px; background: var(--line) }
@media (max-width: 640px) { .site-nav .sep { display: none } .site-nav .door { width: 100% } }

/* Surfaces : une seule élévation pour toutes les cartes du site */
.stat, .panel, .row, .mapbox, .count, .controls, section.bloc, .door-card { box-shadow: var(--shadow-sm) }
footer { color: var(--muted) }
/* Profil et outils de la barre */
.site-tools { margin-left: auto; display: flex; gap: 8px; align-items: center; position: relative }
.site-tools button { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
                     padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 32px }
.site-tools button:hover { border-color: #94a3b8 }
#profil-btn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--orange) }
#profil-panel { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: min(360px, calc(100vw - 32px)); background: var(--surface);
                border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-md); padding: 16px }
#profil-panel form { display: grid; gap: 10px }
#profil-panel label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--muted) }
#profil-panel select { font: inherit; font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 7px 10px; width: 100% }
#profil-panel .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
#profil-panel .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px }
#profil-panel .acts button { font: inherit; font-weight: 600; border-radius: var(--radius-sm); padding: 7px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink) }
#profil-panel .acts button[type=submit] { background: var(--ink); color: #fff; border-color: var(--ink) }
#profil-panel p { margin: 0; font-size: 12px; color: var(--muted) }
@media (max-width: 640px) { .site-tools { margin-left: 0; width: 100% } }
/* Tableaux triables et export */
.th-sort { font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; display: inline-flex; gap: 4px; align-items: baseline }
.th-sort::after { content: "↕" / ""; opacity: .45; font-size: 10px }
th[aria-sort="ascending"] .th-sort::after { content: "↑" / ""; opacity: 1 }
th[aria-sort="descending"] .th-sort::after { content: "↓" / ""; opacity: 1 }
.btn-ghost { font: inherit; font-size: 13px; font-weight: 600; color: var(--accent); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 6px 12px; cursor: pointer; min-height: 32px }
.btn-ghost:hover { background: var(--accent-soft) }
.tablewrap { overflow-x: auto; max-width: 100%; position: relative }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-block: 8px }
/* Accessibilité commune */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0 }
.skip { position: absolute; left: 16px; top: -60px; z-index: 50; background: var(--ink); color: #fff; font-weight: 600; padding: 8px 14px; border-radius: var(--radius-sm); text-decoration: none }
.skip:focus { top: 12px }
main[tabindex="-1"]:focus { outline: none }
/* Champs : bordure contrastée 4,8:1 (WCAG 1.4.11) ; le sélecteur :not(#_) passe devant les styles de page */
select:not(#_), input:not([type=range]):not([type=radio]):not([type=checkbox]):not(#_) { border-color: #64748b }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important } }
</style>
<script id="commun">
// Spédago — fonctions communes à toutes les pages.
//  - Adresse : #<académie>&cle=valeur… (l'académie d'abord, puis les filtres de la page) ; slug() = spedago.referentiel.slug (testé).
//  - Profil : réglages de la personne (rôle, académie, profil d'études, spécialités), gardés dans ce navigateur seulement.
//  - Annonces pour lecteurs d'écran, tableaux triables, export CSV, copie du lien de la vue.
const Spedago = (() => {
  const HAS_DOM = typeof document !== "undefined";
  function slug(nom) {
    let s = String(nom).normalize("NFKD").replace(/[^\x00-\x7f]/g, "").toUpperCase();
    s = s.replace(/[-'\s]+/g, " ").trim().replace(/^ST /, "SAINT ");
    return s.toLowerCase().replace(/ /g, "-");
  }
  // ---- état dans l'adresse
  function parseHash(h) {
    const out = { acad: "", params: {} };
    String(h || "").replace(/^#/, "").split("&").forEach((t, i) => {
      if (!t) return;
      let k, v;
      try { [k, v] = t.split("=").map(decodeURIComponent); } catch (e) { return; }
      if (v === undefined) { if (i === 0) out.acad = k; } else out.params[k] = v;
    });
    return out;
  }
  function buildHash(st) {
    const parts = [];
    if (st.acad) parts.push(st.acad);
    Object.entries(st.params).forEach(([k, v]) => { if (v !== "" && v != null) parts.push(encodeURIComponent(k) + "=" + encodeURIComponent(v)); });
    return parts.length ? "#" + parts.join("&") : "";
  }
  const current = () => parseHash(HAS_DOM ? location.hash : "");
  const hashSlug = () => current().acad;
  const param = (k) => current().params[k];
  function writeHash(st) {
    const h = buildHash(st);
    try { history.replaceState(null, "", h || location.pathname + location.search); } catch (e) { location.hash = h; }
    syncNav();
  }
  function setParams(obj) { const st = current(); Object.assign(st.params, obj); writeHash(st); }
  function setHash(nom) { const st = current(); st.acad = nom ? slug(nom) : ""; writeHash(st); }
  // Les liens de la barre gardent l'académie (les filtres propres à une page restent sur cette page).
  function syncNav() {
    if (!HAS_DOM) return;
    const a = hashSlug();
    document.querySelectorAll(".site-nav a[data-page]").forEach((x) => { x.href = x.dataset.page + (a ? "#" + a : ""); });
  }
  // ---- profil (ce navigateur seulement)
  const KEY = "spedago.profil";
  function profil() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function saveProfil(p) {
    try { if (p) localStorage.setItem(KEY, JSON.stringify(p)); else localStorage.removeItem(KEY); } catch (e) { /* stockage indisponible */ }
    if (HAS_DOM) document.dispatchEvent(new CustomEvent("spedago:profil", { detail: p || {} }));
  }
  // Sélectionne l'option du <select> qui correspond à l'académie de l'adresse, sinon à celle du profil.
  function pick(select) {
    if (!select) return false;
    const h = hashSlug() || profil().academie || ""; if (!h) return false;
    const o = [...select.options].find((x) => x.value !== "" && slug(x.textContent) === h);
    if (o) select.value = o.value;
    return !!o;
  }
  // Restaure / enregistre des contrôles de formulaire dans l'adresse : { cle: element }
  function bind(map, onChange) {
    const p = current().params;
    Object.entries(map).forEach(([k, el]) => {
      if (!el || p[k] === undefined) return;
      if (el.type === "radio") { const r = document.querySelector(`input[name="${el.name}"][value="${p[k]}"]`); if (r) r.checked = true; }
      else if ([...(el.options || [])].length === 0 || [...el.options].some((o) => o.value === p[k])) el.value = p[k];
    });
    const save = () => {
      const o = {};
      Object.entries(map).forEach(([k, el]) => {
        if (!el) return;
        o[k] = el.type === "radio" ? (document.querySelector(`input[name="${el.name}"]:checked`) || {}).value || "" : el.value;
      });
      setParams(o); if (onChange) onChange();
    };
    Object.values(map).forEach((el) => el && el.addEventListener("change", save));
    return save;
  }
  // ---- annonces (WCAG 4.1.3), regroupées
  let tAnn = null;
  function announce(text) {
    if (!HAS_DOM) return;
    const z = document.getElementById("sr-status"); if (!z) return;
    clearTimeout(tAnn); tAnn = setTimeout(() => { z.textContent = ""; setTimeout(() => { z.textContent = String(text).replace(/\s+/g, " ").trim(); }, 50); }, 700);
  }
  // ---- tableaux triables : en-têtes boutons, aria-sort ; valeur de tri = data-v sinon texte
  function sortValue(td) {
    const v = td.dataset.v !== undefined ? td.dataset.v : td.textContent.trim();
    const n = Number(String(v).replace(/\s/g, "").replace(",", ".").replace("%", ""));
    return v !== "" && isFinite(n) ? n : String(v).toLowerCase();
  }
  function applySort(table) {
    const st = table._sort; if (!st) return;
    const tb = table.tBodies[0], rows = [...tb.rows].filter((r) => r.cells.length > st.col);
    rows.sort((a, b) => {
      const x = sortValue(a.cells[st.col]), y = sortValue(b.cells[st.col]);
      const c = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "fr");
      return st.dir === "ascending" ? c : -c;
    });
    rows.forEach((r) => tb.appendChild(r));
    [...table.tHead.rows[0].cells].forEach((th, i) => { if (!th.hasAttribute("data-nosort")) th.setAttribute("aria-sort", i === st.col ? st.dir : "none"); });
  }
  function sortable(table) {
    if (!table || table._sortable) { if (table) applySort(table); return; }
    table._sortable = true;
    [...table.tHead.rows[0].cells].forEach((th, i) => {
      if (th.hasAttribute("data-nosort")) return;
      const b = document.createElement("button"); b.type = "button"; b.className = "th-sort";
      while (th.firstChild) b.appendChild(th.firstChild);
      th.appendChild(b); th.setAttribute("aria-sort", "none");
      b.addEventListener("click", () => {
        const st = table._sort;
        table._sort = { col: i, dir: st && st.col === i && st.dir === "descending" ? "ascending" : "descending" };
        applySort(table); announce(`Tri : ${b.textContent.trim()}, ${table._sort.dir === "ascending" ? "croissant" : "décroissant"}`);
      });
    });
  }
  // ---- export CSV (séparateur « ; », compatible tableur français)
  function csv(rows) {
    return "﻿" + rows.map((r) => r.map((c) => { const s = c == null ? "" : String(c); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(";")).join("\r\n");
  }
  function tableRows(table) {
    return [...table.rows].map((tr) => [...tr.cells].map((c) => (c.dataset.v !== undefined ? c.dataset.v : (c.querySelector(".v") || c).textContent.replace(/\s+/g, " ").trim())));
  }
  async function download(filename, text) {
    try {
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
      a.download = filename; document.body.appendChild(a); a.click(); a.remove(); return true;
    } catch (e) { announce("Export impossible dans cette vue"); return false; }
  }
  // ---- copie du lien de la vue
  async function copyLink(btn) {
    const url = location.href;
    try { await navigator.clipboard.writeText(url); btn.textContent = "Lien copié"; }
    catch (e) { window.prompt("Copiez ce lien :", url); }
    setTimeout(() => { btn.textContent = "Copier le lien"; }, 2000);
  }
  // ---- panneau « Mon profil »
  function initProfil() {
    const btn = document.getElementById("profil-btn"), panel = document.getElementById("profil-panel"); if (!btn || !panel) return;
    const f = panel.querySelector("form"), p = profil();
    const fill = (q) => {
      f.role.value = q.role || ""; f.academie.value = q.academie || ""; f.profilMaster.value = q.profilMaster || "";
      f.spe1.value = (q.specialites || [])[0] || ""; f.spe2.value = (q.specialites || [])[1] || "";
    };
    fill(p);
    const label = () => { const q = profil(), a = f.academie.selectedOptions[0]; btn.querySelector("span").textContent = q.academie && a ? a.textContent : "Mon profil"; };
    label();
    const close = () => { panel.hidden = true; btn.setAttribute("aria-expanded", "false"); };
    btn.addEventListener("click", () => { const o = panel.hidden; panel.hidden = !o; btn.setAttribute("aria-expanded", String(o)); if (o) f.role.focus(); });
    panel.addEventListener("keydown", (e) => { if (e.key === "Escape") { close(); btn.focus(); } });
    f.addEventListener("submit", (e) => {
      e.preventDefault();
      const q = { role: f.role.value, academie: f.academie.value, profilMaster: f.profilMaster.value, specialites: [f.spe1.value, f.spe2.value].filter(Boolean) };
      saveProfil(q); label(); close(); btn.focus(); announce("Profil enregistré dans ce navigateur");
      if (q.academie && !hashSlug()) { const st = current(); st.acad = q.academie; writeHash(st); window.dispatchEvent(new HashChangeEvent("hashchange")); }
    });
    f.querySelector("[data-reset]").addEventListener("click", () => { saveProfil(null); fill({}); label(); announce("Profil effacé"); });
    const cp = document.getElementById("copy-link"); if (cp) cp.addEventListener("click", () => copyLink(cp));
  }
  if (HAS_DOM) {
    document.addEventListener("DOMContentLoaded", () => { syncNav(); initProfil(); });
    window.addEventListener("hashchange", syncNav);
  }
  return { slug, parseHash, buildHash, hashSlug, param, setParams, setHash, syncNav, pick, bind, profil, saveProfil,
           announce, sortable, applySort, csv, tableRows, download };
})();
if (typeof module !== "undefined") module.exports = Spedago;
</script>
