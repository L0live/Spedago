<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style id="commun-css">
/* Spédago — système visuel commun (thème clair uniquement).
   Jetons alignés sur Tailwind : neutres slate, couleur principale blue-700 (liens, navigation, focus),
   couleur secondaire orange (repères : académie choisie, valeurs à surveiller, porte « décideurs »).
   Règle 60-30-10 : neutres partout, bleu pour agir, orange pour signaler — jamais pour décorer. */
:root {
  color-scheme: light;
  --bg: #f8fafc; --surface: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --track: #f1f5f9;
  --accent: #1d4ed8; --accent-strong: #1e40af; --accent-soft: #eff6ff; --accent-mark: #2563eb;
  --orange: #ea580c; --orange-ink: #c2410c; --orange-soft: #fff7ed; --orange-line: #fed7aa;
  --radius: 12px; --radius-sm: 8px;
  --shadow-sm: 0 1px 2px rgb(15 23 42 / .05), 0 1px 3px rgb(15 23 42 / .04);
  --shadow-md: 0 6px 16px -4px rgb(15 23 42 / .10), 0 2px 4px rgb(15 23 42 / .04);
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html { background: var(--bg) }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; padding-inline: 16px; padding-block: 0 48px; margin: 0;
       -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(32px, 5vw, 46px); line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 10px; text-wrap: balance }
h2 { letter-spacing: -0.01em }
::selection { background: var(--orange-line) }
a { color: var(--accent) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
         color: var(--orange-ink); background: var(--orange-soft); border: 1px solid var(--orange-line); border-radius: 999px; padding: 3px 10px; margin-bottom: 16px }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--orange) }
.lede { line-height: 1.6 }

/* Barre du site : marque, puis les deux portes */
.site-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding-block: 16px 12px; border-bottom: 1px solid var(--line); font-size: 14px }
.site-nav .brand { display: inline-flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; margin-right: 8px }
.site-nav .brand::before { content: ""; width: 12px; height: 12px; border-radius: 3px; background: linear-gradient(135deg, var(--accent-mark) 0 50%, var(--orange) 50% 100%) }
.site-nav .door { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px }
.site-nav .door > span { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.site-nav .door a { color: var(--accent); text-decoration: none; padding: 3px 0; border-bottom: 2px solid transparent; transition: color .15s ease-out, border-color .15s ease-out }
.site-nav .door a:hover { color: var(--accent-strong); border-bottom-color: var(--line) }
.site-nav .door a[aria-current="page"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--orange) }
.site-nav .sep { width: 1px; height: 18px; background: var(--line) }
@media (max-width: 640px) { .site-nav .sep { display: none } .site-nav .door { width: 100% } }

/* Surfaces : une seule élévation pour toutes les cartes du site */
.stat, .panel, .row, .mapbox, .count, .controls, section.bloc, .door-card { box-shadow: var(--shadow-sm) }
footer { color: var(--muted) }
</style>
<script id="commun">
// Spédago — fonctions communes : identifiant d'académie dans l'adresse (#poitiers), liens de navigation qui le gardent.
// slug() est identique à spedago.referentiel.slug (testé).
const Spedago = (() => {
  function slug(nom) {
    let s = String(nom).normalize("NFKD").replace(/[^\x00-\x7f]/g, "").toUpperCase();
    s = s.replace(/[-'\s]+/g, " ").trim().replace(/^ST /, "SAINT ");
    return s.toLowerCase().replace(/ /g, "-");
  }
  const hashSlug = () => { try { return decodeURIComponent((typeof location !== "undefined" ? location.hash : "").slice(1)); } catch (e) { return ""; } };
  // Garde l'académie choisie d'une page à l'autre : chaque lien de la barre reçoit le #slug courant.
  function syncNav() {
    if (typeof document === "undefined") return;
    const h = hashSlug();
    document.querySelectorAll(".site-nav a[data-page]").forEach((a) => { a.href = a.dataset.page + (h ? "#" + h : ""); });
  }
  function setHash(nom) {
    const s = nom ? slug(nom) : "";
    try { history.replaceState(null, "", s ? "#" + s : location.pathname + location.search); } catch (e) { location.hash = s; }
    syncNav();
  }
  // Sélectionne dans <select> l'option dont le libellé correspond au #slug ; renvoie vrai si trouvée.
  function pick(select) {
    const h = hashSlug(); if (!h || !select) return false;
    const o = [...select.options].find((x) => x.value !== "" && slug(x.textContent) === h);
    if (o) select.value = o.value;
    return !!o;
  }
  if (typeof document !== "undefined") {
    document.addEventListener("DOMContentLoaded", syncNav);
    window.addEventListener("hashchange", syncNav);
  }
  return { slug, hashSlug, syncNav, setHash, pick };
})();
if (typeof module !== "undefined") module.exports = Spedago;
</script>
